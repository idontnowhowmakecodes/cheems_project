[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheems"
version = "1.0.0"
description = "Sistema de Evaluación del Neurodesarrollo y Observación Motora Asistida (STAT & ADOS-2)"
requires-python = ">=3.11"
dependencies = [
  "mediapipe>=0.10.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "pywebview>=5.0.0",
  "cryptography>=42.0.0",
  "reportlab>=4.0.0",
  "fpdf2>=2.7.0",
]

[project.scripts]
cheems = "cheems.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cheems*"]
