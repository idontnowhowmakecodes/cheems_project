[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheems_project-peru"
version = "0.1.0"
description = "Herramienta no clínica de observación motora con MediaPipe"
requires-python = ">=3.11"
dependencies = [
  "mediapipe==1.0.0",
  "opencv-contrib-python==5.0.0.93",
  "numpy",
  "matplotlib",
]

[project.scripts]
cheems_project = "cheems_project.app:main"

[tool.setuptools.packages.find]
where = ["scr"]
